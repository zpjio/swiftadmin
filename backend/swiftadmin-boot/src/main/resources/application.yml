server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/xml
    min-response-size: 1024

spring:
  application:
    name: swiftadmin
  profiles:
    active: dev
  aop:
    proxy-target-class: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB
      file-size-threshold: 2MB

# 日志配置
logging:
  level:
    cn.swiftadmin: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    path: ./logs
    name: ${logging.file.path}/swiftadmin.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# Springdoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# MyBatis-Flex 配置
mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.swiftadmin.**.entity
  configuration:
    map-underscore-to-camel-case: true

# 雪花ID生成器配置
swiftadmin:
  id-generator:
    enabled: true                       # 是否启用雪花ID生成器
    # worker-id: 0                      # 工作机器ID (0-31)，分布式环境需唯一，不配置则自动生成
    # datacenter-id: 0                  # 数据中心ID (0-31)，分布式环境需唯一，不配置则自动生成

# 认证安全配置
auth:
  security:
    # 账号密码登录配置
    max-login-fail-count: 5          # 最大登录失败次数
    lock-minutes: 15                  # 账户锁定时间（分钟）

    # Token 配置
    refresh-interval-seconds: 5       # Token 刷新最小间隔（秒）
    max-refresh-count-per-day: 50     # 每日最大 Token 刷新次数
    state-expire-minutes: 10          # OAuth State 有效期（分钟）
    temp-token-expire-minutes: 10     # 临时 Token 有效期（分钟）

    # 短信验证码配置
    code-expire-minutes: 5            # 验证码有效期（分钟）
    send-interval-seconds: 60         # 单手机号发送间隔（秒）
    max-send-per-hour: 5              # 单手机号 1 小时最大发送次数
    max-ip-send-per-hour: 10          # 同一 IP 1 小时最大发送次数
    captcha-trigger-threshold: 3      # 触发图形验证码的 IP 发送阈值
    max-verify-fail-count: 3          # 验证码错误次数上限
    verify-lock-minutes: 15           # 验证错误锁定时间（分钟）

    # 缓存配置
    user-cache-expire-minutes: 30     # 用户信息缓存有效期（分钟）

    # 社交 Token 配置
    refresh-threshold-hours: 24       # 社交 Token 刷新阈值（小时）
    bind-lock-timeout-seconds: 30     # 社交账号绑定锁超时时间（秒）

    # Token 上下文验证配置
    token-context-validation-mode: MODERATE  # 验证模式：STRICT/MODERATE/LOOSE
    ip-change-threshold: 3            # IP 变化次数阈值（MODERATE 模式）
    ip-change-window-minutes: 30      # IP 变化统计时间窗口（分钟）

  # 密码策略配置
  password:
    # 长度配置
    min-length: 8                     # 最小密码长度
    max-length: 32                    # 最大密码长度

    # 复杂度要求
    require-uppercase: true           # 是否要求包含大写字母
    require-lowercase: true           # 是否要求包含小写字母
    require-digit: true               # 是否要求包含数字
    require-special-char: false       # 是否要求包含特殊字符

    # 高级安全配置
    forbid-contain-username: true     # 是否禁止包含用户名
    max-sequential-chars: 3           # 连续字符检测长度（0表示不检测）
    max-repeating-chars: 3            # 重复字符检测长度（0表示不检测）
    history-check-count: 5            # 历史密码检查次数（0表示不检查）

    # 弱密码检测
    enable-weak-password-check: true  # 是否启用弱密码检测
