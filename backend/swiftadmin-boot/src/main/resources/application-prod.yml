# 生产环境配置

spring:
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # HikariCP 连接池配置（生产环境）
    hikari:
      pool-name: SwiftAdminHikariPool
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 300000       # 5 分钟
      max-lifetime: 1200000      # 20 分钟
      connection-timeout: 30000   # 30 秒
      leak-detection-threshold: 300000  # 5 分钟，连接泄露检测

  # H2 控制台（生产环境禁用）
  h2:
    console:
      enabled: false

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    placeholder-replacement: false

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 5000ms

# JWT 配置（生产环境必须通过环境变量设置）
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000        # 2 小时
  refresh-expiration: 604800000  # 7 天

# 短信服务配置
sms:
  provider: ${SMS_PROVIDER:aliyun}
  aliyun:
    access-key-id: ${SMS_ALIYUN_ACCESS_KEY}
    access-key-secret: ${SMS_ALIYUN_SECRET_KEY}
    sign-name: ${SMS_ALIYUN_SIGN_NAME}
    template-code: ${SMS_ALIYUN_TEMPLATE_CODE}
  tencent:
    secret-id: ${SMS_TENCENT_SECRET_ID:}
    secret-key: ${SMS_TENCENT_SECRET_KEY:}
    app-id: ${SMS_TENCENT_APP_ID:}
    sign-name: ${SMS_TENCENT_SIGN_NAME:}
    template-id: ${SMS_TENCENT_TEMPLATE_ID:}

# 第三方社交登录配置
social:
  token-secret: ${SOCIAL_TOKEN_SECRET}
  wecom:
    corp-id: ${WECOM_CORP_ID:}
    agent-id: ${WECOM_AGENT_ID:}
    secret: ${WECOM_SECRET:}
    redirect-uri: ${WECOM_REDIRECT_URI:}
  dingtalk:
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    redirect-uri: ${DINGTALK_REDIRECT_URI:}
  feishu:
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    redirect-uri: ${FEISHU_REDIRECT_URI:}

# 文件存储配置
file:
  storage:
    type: ${FILE_STORAGE_TYPE:oss}

    local:
      base-path: ${FILE_LOCAL_BASE_PATH:/data/uploads}
      access-url: /files
      max-file-size: 10485760

    oss:
      enabled: true
      endpoint: ${OSS_ENDPOINT}
      access-key-id: ${OSS_ACCESS_KEY_ID}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET}
      bucket-name: ${OSS_BUCKET_NAME}
      region: ${OSS_REGION}
      custom-domain: ${OSS_CUSTOM_DOMAIN:}
      path-prefix: swiftadmin
      max-file-size: 10485760

# 日志配置（生产环境）
logging:
  level:
    cn.swiftadmin: info
    org.springframework: warn
  file:
    path: /var/log/swiftadmin
    name: ${logging.file.path}/swiftadmin.log

# Springdoc OpenAPI 配置（生产环境禁用）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Actuator 配置（生产环境）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true