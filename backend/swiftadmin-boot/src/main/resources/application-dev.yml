# 开发环境配置

spring:
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:swiftadmin}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    # HikariCP 连接池配置
    hikari:
      pool-name: SwiftAdminHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000       # 5 分钟
      max-lifetime: 1200000      # 20 分钟
      connection-timeout: 30000   # 30 秒
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000  # 1 分钟，连接泄露检测

  # H2 控制台（MySQL 环境禁用）
  h2:
    console:
      enabled: false

  # Flyway 数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
    placeholder-replacement: false

  # Redis 配置（开发环境使用嵌入式或本地 Redis）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:7}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 5
          min-idle: 0

# MyBatis-Flex 配置
mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.swiftadmin.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT 配置
jwt:
  # 密钥必须至少 32 字节（256 位），生产环境请使用环境变量或配置中心管理
  secret: ${JWT_SECRET:swiftadmin-dev-secret-key-must-be-at-least-32-bytes-long}
  expiration: 7200000  # 2 小时
  refresh-expiration: 604800000  # 7 天

# 短信服务配置
sms:
  provider: aliyun  # aliyun|tencent
  aliyun:
    access-key-id: ${SMS_ALIYUN_ACCESS_KEY:test-access-key}
    access-key-secret: ${SMS_ALIYUN_SECRET_KEY:test-secret-key}
    sign-name: SwiftAdmin
    template-code: SMS_123456789
  tencent:
    secret-id: ${SMS_TENCENT_SECRET_ID:test-secret-id}
    secret-key: ${SMS_TENCENT_SECRET_KEY:test-secret-key}
    app-id: "1400000000"
    sign-name: SwiftAdmin
    template-id: "123456"

# 第三方社交登录配置
social:
  # Token 加密密钥（生产环境请使用环境变量，至少 32 字节）
  token-secret: ${SOCIAL_TOKEN_SECRET:swiftadmin-social-token-secret-key-must-be-32bytes}
  wecom:
    corp-id: ${WECOM_CORP_ID:test-corp-id}
    agent-id: ${WECOM_AGENT_ID:test-agent-id}
    secret: ${WECOM_SECRET:test-secret}
    redirect-uri: http://localhost:8089/api/auth/social/callback
  dingtalk:
    app-key: ${DINGTALK_APP_KEY:test-app-key}
    app-secret: ${DINGTALK_APP_SECRET:test-app-secret}
    redirect-uri: http://localhost:8089/api/auth/social/callback
  feishu:
    app-id: ${FEISHU_APP_ID:test-app-id}
    app-secret: ${FEISHU_APP_SECRET:test-app-secret}
    redirect-uri: http://localhost:8089/api/auth/social/callback

# 文件存储配置
file:
  storage:
    # 默认存储类型：local（本地）, oss（对象存储）
    type: local

    # 本地存储配置
    local:
      # 本地存储基础路径
      base-path: ${FILE_LOCAL_BASE_PATH:./uploads}
      # 文件访问 URL 前缀
      access-url: /files
      # 单个文件最大大小（字节），默认 10MB
      max-file-size: 10485760

    # OSS 存储配置（阿里云/腾讯云/MinIO 等）
    oss:
      # 是否启用 OSS 存储
      enabled: false
      # OSS 端点地址（阿里云：https://oss-cn-hangzhou.aliyuncs.com，MinIO：http://localhost:9000）
      endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
      # 访问密钥 ID
      access-key-id: ${OSS_ACCESS_KEY_ID:your-access-key-id}
      # 访问密钥 Secret
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:your-access-key-secret}
      # Bucket 名称
      bucket-name: ${OSS_BUCKET_NAME:your-bucket-name}
      # 区域
      region: oss-cn-beijing
      # 自定义域名（可选，如：https://cdn.example.com）
      custom-domain:
      # 路径前缀
      path-prefix: swiftadmin
      # 单个文件最大大小（字节），默认 10MB
      max-file-size: 10485760

# Spring 文件上传配置（合并到主 spring 配置下）
  servlet:
    multipart:
      # 是否启用 multipart 上传
      enabled: true
      # 单个文件最大大小
      max-file-size: 10MB
      # 请求总最大大小
      max-request-size: 100MB
      # 文件大小阈值，超过此值会写入临时文件
      file-size-threshold: 1MB

