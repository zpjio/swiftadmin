services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: swiftadmin-mysql
    environment:
      # 默认值与应用 dev 默认账号(${DB_USERNAME:root}/${DB_PASSWORD:root})及 CI 保持一致,
      # docker compose up 后可直接跑 mvn test 而无需注入环境变量
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-swiftadmin}
      MYSQL_USER: ${DB_USERNAME:-swiftadmin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-swiftadmin123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - swiftadmin-network
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: swiftadmin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - swiftadmin-network
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/backend/Dockerfile
    container_name: swiftadmin-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-swiftadmin}
      DB_USERNAME: ${DB_USERNAME:-swiftadmin}
      DB_PASSWORD: ${DB_PASSWORD:-swiftadmin123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-at-least-32-bytes}
      SOCIAL_TOKEN_SECRET: ${SOCIAL_TOKEN_SECRET:-please-change-this-social-secret-32bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8080:8080"
    networks:
      - swiftadmin-network
    restart: unless-stopped

  # 前端服务（Nginx）
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/frontend/Dockerfile
    container_name: swiftadmin-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - swiftadmin-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

networks:
  swiftadmin-network:
    driver: bridge
