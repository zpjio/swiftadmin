name: Native (GraalVM)

on:
  schedule:
    # 每周五 UTC 18:00(北京时间周六 02:00)夜间巡检
    - cron: '0 18 * * 5'
  workflow_dispatch: {}

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Backend Native Image (GraalVM 25)
    runs-on: ubuntu-latest
    # Boot AOT(process-aot)会完整刷新应用上下文,Flyway/Hikari 等在启动期
    # 建立的组件需要真实服务可达——与 ci.yml 保持一致的 service 拓扑
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: swiftadmin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven

      # Boot AOT 处理(process-aot)与 native:compile 均挂接在 -Pnative 的
      # package 阶段(见 backend/pom.xml 的 native profile)
      - name: Build native image
        working-directory: backend
        run: mvn -B --no-transfer-progress -Pnative -DskipTests -pl swiftadmin-boot -am package

      # native-maven-plugin 默认 imageName = artifactId,产物无 -exec 后缀
      - name: Upload native binary (for inspection only)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: swiftadmin-native-${{ github.sha }}
          path: backend/swiftadmin-boot/target/swiftadmin-boot
          if-no-files-found: error
